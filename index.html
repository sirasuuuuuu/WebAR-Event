<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>キャラクターAR体験</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111827; color: #fff; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 680px); text-align: center; }
    h1 { font-size: clamp(1.5rem, 6vw, 2.2rem); margin: 0 0 8px; }
    p { line-height: 1.65; color: #d1d5db; }
    model-viewer { width: 100%; height: min(62vh, 520px); min-height: 320px; background: #1f2937; border-radius: 18px; --poster-color: #1f2937; }
    #ar-button { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); border: 0; border-radius: 999px; padding: 14px 22px; font-size: 1rem; font-weight: 700; color: #111827; background: #a7f3d0; white-space: nowrap; }
    #status { min-height: 1.5em; font-size: .92rem; }
    .hint { font-size: .85rem; }
    .fallback { display: none; padding: 12px; border: 1px solid #fbbf24; border-radius: 12px; color: #fde68a; }
  </style>
</head>
<body>
  <main>
    <h1>キャラクターと写真を撮ろう</h1>
    <p>下のボタンからARを起動し、床など平らな場所にキャラクターを置いてください。</p>
    <div id="fallback" class="fallback">モデルを読み込めませんでした。assetsフォルダ内のtest_box.glbとtest_box.usdzを確認してください。</div>
    <model-viewer id="character" src="assets/test_box.glb" ios-src="assets/test_box.usdz" alt="イベントキャラクターの3Dモデル" ar ar-modes="scene-viewer quick-look" ar-placement="floor" camera-controls shadow-intensity="1" exposure="1" interaction-prompt="auto">
      <button slot="ar-button" id="ar-button">ARでキャラクターを置く</button>
    </model-viewer>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">ARが始まらない場合は、対応するスマートフォンの標準ブラウザで開いてください。</p>
  </main>
  <script>
    const viewer = document.querySelector('#character');
    const fallback = document.querySelector('#fallback');
    const status = document.querySelector('#status');
    viewer.addEventListener('error', () => { fallback.style.display = 'block'; });
    viewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'failed') status.textContent = 'ARを起動できませんでした。対応端末・ブラウザをご確認ください。';
      else if (event.detail.status === 'session-started') status.textContent = '画面の案内に従って、平らな場所に置いてください。';
    });
  </script>
</body>
</html>
