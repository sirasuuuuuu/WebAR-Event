<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06271f">
  <title>キャラクターAR体験</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"}}
  </script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #06271f; color: #fff; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); text-align: center; }
    h1 { font-size: clamp(1.5rem, 6vw, 2.1rem); margin: 0 0 10px; }
    p { line-height: 1.65; color: #d1d5db; }
    #spot-label { color: #a7f3d0; font-weight: 700; margin: 0 0 12px; }
    #character { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #start-ar { display: block; width: min(100%, 420px); margin: 22px auto 10px; padding: 17px 22px; border: 0; border-radius: 999px; background: #d7b96b; color: #17251c; font-size: 1.08rem; font-weight: 800; }
    #start-ar:disabled { opacity: .55; }
    #status { min-height: 1.5em; font-size: .95rem; }
    .hint { font-size: .86rem; }
    .fallback { display: none; padding: 12px; border: 1px solid #fbbf24; border-radius: 12px; color: #fde68a; }
    #ar-overlay[hidden] { display: none; }
    #ar-overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; color: white; font-size: 16px; }
    #ar-message { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(90vw, 460px); padding: 12px 16px; border-radius: 14px; background: rgb(17 24 39 / 88%); line-height: 1.45; text-align: center; }
    #hit-marker { display: none; position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); border: 2px solid #286b4d; border-radius: 50%; opacity: .32; box-shadow: 0 0 0 1px rgb(255 255 255 / 55%), 0 0 12px 4px rgb(40 107 77 / 48%); }
    #hit-marker::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%); border-radius: 50%; background: #286b4d; box-shadow: 0 0 0 1px rgb(255 255 255 / 70%); }
    #end-ar { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); padding: 11px 16px; border: 0; border-radius: 999px; background: white; color: #111827; font-weight: 700; pointer-events: auto; }
    #explanation { display: none; position: absolute; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(88vw, 460px); padding: 16px 18px; border: 2px solid white; border-radius: 18px; background: rgb(17 24 39 / 92%); line-height: 1.6; text-align: left; white-space: pre-wrap; box-shadow: 0 4px 24px #0008; }
    #explanation::before { content: ""; position: absolute; left: 50%; top: -11px; width: 18px; height: 18px; background: #172033; border-left: 2px solid white; border-top: 2px solid white; transform: translateX(-50%) rotate(45deg); }
    @media (max-width: 520px) { body { padding: 20px; } #ar-message { top: max(76px, calc(env(safe-area-inset-top) + 68px)); } }
  </style>
</head>
<body>
  <main>
    <p id="spot-label">イベントAR</p>
    <h1 id="title">キャラクターに会いに行こう</h1>
    <p id="intro">キャラクターをこの場所に登場させます。</p>
    <div id="fallback" class="fallback">モデルを読み込めませんでした。assets/character.glb と assets/character.usdz を確認してください。</div>
    <model-viewer id="character" src="assets/character.glb" ios-src="assets/character.usdz" alt="イベントキャラクター" ar ar-modes="quick-look" ar-scale="fixed" camera-controls></model-viewer>
    <button id="start-ar" type="button" disabled>モデルを読み込んでいます…</button>
    <p id="status" role="status" aria-live="polite">読み込み中です。</p>
    <p class="hint">ボタンを押すとカメラが起動します。Androidは床や机を検出後にタップして配置、iPhoneはQuick Lookで表示します。</p>
  </main>
  <div id="ar-overlay" hidden>
    <div id="ar-message" role="status" aria-live="polite">床や机に向けて、ゆっくり動かしてください。</div>
    <div id="hit-marker" aria-hidden="true"></div>
    <div id="explanation" role="status" aria-live="polite"></div>
    <button id="end-ar" type="button">終了</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { clone as cloneSkinnedModel } from 'three/addons/utils/SkeletonUtils.js';

    const viewer = document.querySelector('#character');
    const fallback = document.querySelector('#fallback');
    const startButton = document.querySelector('#start-ar');
    const status = document.querySelector('#status');
    const arOverlay = document.querySelector('#ar-overlay');
    const arMessage = document.querySelector('#ar-message');
    const hitMarker = document.querySelector('#hit-marker');
    const explanationPanel = document.querySelector('#explanation');
    const endButton = document.querySelector('#end-ar');
    const loader = new GLTFLoader();
    const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const spotId = new URLSearchParams(location.search).get('spot') || '01';
    let xrSupported = false;

    let spot = null;
    let modelScene = null;
    let companionScene = null;
    let companionLoadError = null;
    let modelScale = 1;
    let modelYOffset = 0;
    let modelHeight = 0;
    let renderer = null;
    let gl = null;
    let scene = null;
    let camera = null;
    let reticle = null;
    let reticleMaterial = null;
    let activeSession = null;
    let hitTestSource = null;
    let localSpace = null;
    let placedGroup = null;
    let placedModel = null;
    let companionFaceRig = null;
    let lastHitMatrix = null;
    let explanationTimer = null;
    let arMessageTimer = null;

    async function loadSpot() {
      // GitHub Pages may cache JSON responses for 10 minutes. Use a unique URL
      // so a newly published spot configuration reaches phones immediately.
      const response = await fetch(`spots.json?cb=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error('spots.json を読み込めません');
      const spots = await response.json();
      spot = spots[spotId] || spots['01'];
      document.title = `${spot.label} | キャラクターAR体験`;
      document.querySelector('#spot-label').textContent = spot.label;
      document.querySelector('#title').textContent = spot.title || 'キャラクターに会いに行こう';
      document.querySelector('#intro').textContent = spot.intro || 'キャラクターをこの場所に登場させます。';
      viewer.setAttribute('src', `${spot.modelGlb}?v=${spot.version || '1'}`);
      viewer.setAttribute('ios-src', `${spot.iosModelUsdz || spot.modelUsdz}?v=${spot.version || '1'}`);
      return spot;
    }

    const modelReady = loadSpot().then(async () => {
      const gltf = await loader.loadAsync(`${spot.modelGlb}?v=${spot.version || '1'}`);
      modelScene = gltf.scene;
      const bounds = new THREE.Box3().setFromObject(modelScene);
      const size = bounds.getSize(new THREE.Vector3());
      modelScale = Number(spot.modelScale ?? 1);
      modelYOffset = -bounds.min.y * modelScale;
      modelHeight = size.y * modelScale;
      if (!isAppleMobile) {
        xrSupported = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
        if (!xrSupported) {
          status.textContent = 'この端末ではWebARを利用できません。AndroidのChromeで開いてください。';
          startButton.textContent = 'この端末ではARを利用できません';
          return modelScene;
        }
      }
      if (!isAppleMobile && spot.companionModelGlb) {
        try {
          const companionUrl = `${spot.companionModelGlb}?v=${encodeURIComponent(spot.version || '1')}`;
          companionScene = (await loader.loadAsync(companionUrl)).scene;
          const companionBounds = new THREE.Box3().setFromObject(companionScene);
          if (companionBounds.isEmpty()) throw new Error('吹き出しモデルに表示できる形状がありません');
          console.info('Companion model ready', companionUrl, companionBounds.getSize(new THREE.Vector3()).toArray());
        } catch (error) {
          companionLoadError = error;
          console.error('Companion model load failed', error);
        }
      }
      status.textContent = companionLoadError
        ? '吹き出しを読み込めませんでした。通信状態をご確認ください。'
        : companionScene
          ? 'ネズミと吹き出しの準備ができました。ボタンを押してARを開始してください。'
          : '準備ができました。ボタンを押してARを開始してください。';
      startButton.disabled = false;
      startButton.textContent = 'ARを開始する';
      return modelScene;
    }).catch((error) => {
      console.error('AR model load failed', error);
      fallback.style.display = 'block';
      status.textContent = 'モデルまたはスポット設定を読み込めませんでした。通信状態をご確認ください。';
      startButton.textContent = '読み込みエラー';
      return null;
    });

    viewer.addEventListener('error', () => { fallback.style.display = 'block'; });
    viewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'failed') status.textContent = 'iPhoneのARを起動できませんでした。Safariで開いてください。';
    });

    function createARContext() {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:99;pointer-events:none;';
      gl = canvas.getContext('webgl2', { alpha: true, antialias: true });
      if (!gl) throw new Error('WebGL 2コンテキストを作成できませんでした');
    }

    function createARScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x58606b, 1.8));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(1, 3, 2);
      scene.add(keyLight);
      const ringGeometry = new THREE.RingGeometry(0.13, 0.18, 48);
      ringGeometry.rotateX(-Math.PI / 2);
      reticle = new THREE.Group();
      reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x286b4d, transparent: true, opacity: 1, side: THREE.DoubleSide, depthTest: false, depthWrite: false, toneMapped: false });
      const ring = new THREE.Mesh(ringGeometry, reticleMaterial);
      ring.renderOrder = 10000;
      reticle.add(ring);
      const center = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 12), reticleMaterial);
      center.position.y = 0.025;
      center.renderOrder = 10000;
      reticle.add(center);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);
      renderer = new THREE.WebGLRenderer({ canvas: gl.canvas, context: gl, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.setClearColor(0x000000, 0);
      renderer.autoClear = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);
    }

    function showExplanationAfterDelay() {
      clearTimeout(explanationTimer);
      explanationPanel.style.display = 'none';
      if (!spot.explanation) return;
      explanationTimer = setTimeout(() => {
        explanationPanel.textContent = spot.explanation;
        explanationPanel.style.display = 'block';
      }, Math.max(0, Number(spot.explanationDelayMs ?? 2500)));
    }

    function showTemporaryARMessage(message, durationMs = 5000) {
      clearTimeout(arMessageTimer);
      arMessage.textContent = message;
      arMessage.style.display = 'block';
      arMessageTimer = setTimeout(() => {
        arMessage.textContent = '';
        arMessage.style.display = 'none';
        arMessageTimer = null;
      }, durationMs);
    }

    function placeModel() {
      if (!lastHitMatrix || !modelScene) return;
      if (!placedGroup) {
        placedGroup = new THREE.Group();
        placedModel = cloneSkinnedModel(modelScene);
        placedModel.position.y = modelYOffset;
        placedModel.scale.setScalar(modelScale);
        placedGroup.add(placedModel);
        scene.add(placedGroup);
        if (companionScene) {
          const companion = cloneSkinnedModel(companionScene);
          companionFaceRig = new THREE.Group();
          const scale = Number(spot.companionScale ?? 1);
          companion.scale.setScalar(scale);
          const bounds = new THREE.Box3().setFromObject(companion);
          const center = bounds.getCenter(new THREE.Vector3());
          // Center the plaque over the character and place its lowest point
          // above the character, regardless of the model's original origin.
          companion.position.set(
            -center.x + Number(spot.companionXOffset ?? 0),
            modelYOffset + modelHeight + Number(spot.companionYOffset ?? 0.12) - bounds.min.y,
            -center.z
          );
          companion.traverse((object) => {
            if (!object.isMesh) return;
            const materials = Array.isArray(object.material) ? object.material : [object.material];
            for (const material of materials) {
              if (material) {
                material.side = THREE.DoubleSide;
                material.needsUpdate = true;
              }
            }
          });
          companionFaceRig.add(companion);
          placedGroup.add(companionFaceRig);
          placedGroup.updateMatrixWorld(true);
        }
      }
      lastHitMatrix.decompose(placedGroup.position, placedGroup.quaternion, placedGroup.scale);
      placedGroup.visible = true;
      placedGroup.updateMatrixWorld(true);
      orientCompanionAtPlacement();
      if (reticleMaterial) reticleMaterial.opacity = 0.3;
      showTemporaryARMessage(companionScene
        ? 'ネズミと吹き出しを配置しました。別の場所をタップすると置き直せます。'
        : companionLoadError
          ? 'ネズミは配置しましたが、吹き出しを読み込めませんでした。'
          : '配置しました。別の場所をタップすると置き直せます。');
      status.textContent = companionScene ? 'ARにネズミと吹き出しを配置しました。' : 'ARに配置しました。';
      showExplanationAfterDelay();
    }

    function orientCompanionAtPlacement() {
      if (spot?.companionFaceViewer === false || !companionFaceRig || !placedGroup || !camera) return;
      placedGroup.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);
      const cameraPosition = camera.getWorldPosition(new THREE.Vector3());
      const companionPosition = companionFaceRig.getWorldPosition(new THREE.Vector3());
      const towardViewer = cameraPosition.sub(companionPosition);
      towardViewer.y = 0;
      if (towardViewer.lengthSq() < 1e-8) return;
      towardViewer.normalize();
      const parentRotation = placedGroup.getWorldQuaternion(new THREE.Quaternion()).invert();
      towardViewer.applyQuaternion(parentRotation);
      // The baked plaque visible face points along local +Z.
      companionFaceRig.rotation.y = Math.atan2(towardViewer.x, towardViewer.z) + Number(spot.companionFacingOffsetY ?? 0);
      companionFaceRig.updateMatrixWorld(true);
    }

    function onXRFrame(_time, frame) {
      const session = frame.session;
      session.requestAnimationFrame(onXRFrame);
      const layer = session.renderState.baseLayer;
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      const viewerPose = frame.getViewerPose(localSpace);
      if (!viewerPose) return;
      if (hitTestSource) {
        const hits = frame.getHitTestResults(hitTestSource);
        const pose = hits.length ? hits[0].getPose(localSpace) : null;
        if (pose) {
          lastHitMatrix = new THREE.Matrix4().fromArray(pose.transform.matrix);
          reticle.matrix.copy(lastHitMatrix);
          reticle.matrixWorldNeedsUpdate = true;
          reticle.updateMatrixWorld(true);
          reticle.visible = true;
          hitMarker.style.display = 'block';
          if (!placedGroup) {
            arMessage.style.display = 'block';
            arMessage.textContent = '緑の目印が出ました。ここに置くには画面をタップしてください。';
          }
        } else {
          lastHitMatrix = null;
          reticle.visible = false;
          hitMarker.style.display = 'none';
          if (!placedGroup) {
            arMessage.style.display = 'block';
            arMessage.textContent = '床や机に向けて、スマホをゆっくり動かしてください。';
          }
        }
      }
      for (const view of viewerPose.views) {
        const viewport = layer.getViewport(view);
        gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
        renderer.setSize(viewport.width, viewport.height, false);
        renderer.setViewport(viewport.x, viewport.y, viewport.width, viewport.height);
        camera.matrix.fromArray(view.transform.matrix);
        camera.projectionMatrix.fromArray(view.projectionMatrix);
        camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
        camera.matrixWorldNeedsUpdate = true;
        camera.updateMatrixWorld(true);
        renderer.clearDepth();
        renderer.render(scene, camera);
      }
    }

    async function startAndroidAR() {
      arOverlay.hidden = false;
      hitMarker.style.display = 'none';
      explanationPanel.style.display = 'none';
      arMessage.style.display = 'block';
      arMessage.textContent = '床や机に向けて、スマホをゆっくり動かしてください。';
      status.textContent = '';
      try {
        createARContext();
        activeSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local', 'hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: arOverlay }
        });
        activeSession.addEventListener('end', cleanupAR, { once: true });
        await gl.makeXRCompatible();
        createARScene();
        activeSession.updateRenderState({ baseLayer: new XRWebGLLayer(activeSession, gl, { alpha: true, depth: true }) });
        localSpace = await activeSession.requestReferenceSpace('local');
        const viewerSpace = await activeSession.requestReferenceSpace('viewer');
        hitTestSource = await activeSession.requestHitTestSource({ space: viewerSpace });
        activeSession.addEventListener('select', placeModel);
        activeSession.requestAnimationFrame(onXRFrame);
      } catch (error) {
        console.error('WebXR start failed', error);
        const detail = `${error?.name || 'Error'}: ${error?.message || '詳細不明'}`;
        status.textContent = `AR開始に失敗しました（${detail}）。ChromeとGoogle Play開発者サービス（AR）をご確認ください。`;
        if (activeSession) { try { await activeSession.end(); } catch (endError) { console.warn('AR session cleanup failed', endError); } }
        await cleanupAR();
      }
    }

    async function cleanupAR() {
      clearTimeout(explanationTimer);
      clearTimeout(arMessageTimer);
      if (renderer) { renderer.dispose(); renderer.domElement.remove(); }
      if (hitTestSource) hitTestSource.cancel();
      if (activeSession) activeSession.removeEventListener('select', placeModel);
      renderer = null; gl = null; scene = null; camera = null; reticle = null; reticleMaterial = null; placedGroup = null; placedModel = null; companionFaceRig = null;
      hitTestSource = null; localSpace = null; lastHitMatrix = null; activeSession = null;
      arMessageTimer = null; hitMarker.style.display = 'none'; arMessage.style.display = 'block'; explanationPanel.style.display = 'none'; arOverlay.hidden = true;
    }

    startButton.addEventListener('click', () => {
      if (startButton.disabled) return;
      if (isAppleMobile) viewer.activateAR();
      else if (xrSupported) startAndroidAR();
    });
    endButton.addEventListener('click', () => activeSession?.end());
  </script>
</body>
</html>
